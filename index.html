<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eff1">
  <meta name="description" content="Una invitación muy especial está esperando por ti.">
  <title>Nuestra boda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Italiana&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=37">
</head>
<body>
  <main class="scene">
    <div class="glow glow--rose"></div>
    <div class="glow glow--sage"></div>

    <section class="locket" aria-label="Portada de invitación de boda">
      <img class="locket__frame" src="assets/marco.png" alt="" draggable="false">

      <div class="locket__inside">
        <div class="swans" aria-hidden="true">
          <img class="swan swan--left" src="assets/cisne-der.png" alt="">
          <img class="swan swan--right" src="assets/cisne-izq.png" alt="">
        </div>

        <img class="calla" src="assets/cala.png" alt="" aria-hidden="true">
        <img class="pearls" src="assets/perlas.png?v=22" alt="" aria-hidden="true">

        <button class="invitation-trigger" type="button" aria-label="Abrir la invitación" aria-expanded="false">
          <span class="card card--left">Click<br>the</span>
          <span class="card card--right">Button</span>
        </button>

        <button class="pearl-button" type="button" aria-label="Abrir la invitación">
          <img src="assets/boton.png" alt="">
        </button>
      </div>
    </section>

    <p class="hint">Toca para abrir</p>

    <section class="details" aria-hidden="true">
      <button class="details__close" type="button" aria-label="Cerrar invitación">×</button>
      <header class="details__header">
        <p>¡Nos vamos a casar!</p>
        <h1>Alison &amp; Mateo</h1>
      </header>

      <div class="photo-booth">
        <img class="photo-booth__frame" src="assets/marco.png" alt="" aria-hidden="true">
        <div class="film-output">
          <div class="film-strip" aria-label="Tres fotografías de la pareja">
            <div class="film-strip__photo film-strip__photo--one"></div>
            <div class="film-strip__photo film-strip__photo--two"></div>
            <div class="film-strip__photo film-strip__photo--three"></div>
            <p>28.09.2026</p>
          </div>
        </div>
        <img class="photo-booth__slot-mask" src="assets/marco.png" alt="" aria-hidden="true">

        <img class="photo-booth__flower" src="assets/cala.png" alt="" aria-hidden="true">
        <img class="photo-booth__pearls" src="assets/perlas.png?v=28" alt="" aria-hidden="true">
      </div>

      <button class="details__cta" type="button">Abrir invitación</button>
    </section>

    <section class="invitation-page" aria-hidden="true">
      <button class="invitation-page__back" type="button" aria-label="Volver a las fotografías">←</button>

      <div class="invitation-composition">
        <img class="invitation-envelope" src="assets/sobre-flores.png" alt="Sobre de boda con calas" draggable="false">
        <img class="invitation-flowers" src="assets/calas-dobles.png" alt="" aria-hidden="true">
        <img class="photo-locket photo-locket--back" src="assets/collar-fotos.png" alt="Retratos de la pareja en un medallón">

        <div class="record-player">
          <img class="record-player__disc" src="assets/disco.png" alt="Disco de vinilo">
          <svg class="record-player__legend" viewBox="0 0 300 300" aria-hidden="true">
            <defs><path id="listen-curve" d="M 55 185 A 95 95 0 0 1 245 185" /></defs>
            <text><textPath href="#listen-curve" startOffset="50%" text-anchor="middle">CLICK PARA ESCUCHAR</textPath></text>
          </svg>
          <button class="record-player__button" type="button" aria-label="Reproducir música" aria-pressed="false">
            <img src="assets/boton-play.png" alt="">
          </button>
        </div>
        <img class="photo-locket photo-locket--pearls" src="assets/collar-fotos.png" alt="" aria-hidden="true">

        <article class="wedding-card" aria-label="Datos de la boda">
          <img src="assets/tarjeta-encaje-oval.png" alt="" aria-hidden="true">
          <div class="wedding-card__copy">
            <p class="wedding-card__eyebrow">Acompáñanos a celebrar</p>
            <p class="wedding-card__small">la boda de</p>
            <h2>Alison <span>&amp;</span> Mateo</h2>
            <div class="wedding-card__flourish" aria-hidden="true"><span></span>❦<span></span></div>
            <time datetime="2026-09-28">28 · 09 · 2026</time>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js?v=37"></script>
</body>
</html>
